<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de muebles de Muebles de Mi Casa.">
  <title>Muebles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-rule" aria-hidden="true"></div>
    <h1>Muebles</h1>
    <p class="contact">CONTACTO CON PROPIETARIO: <a href="mailto:mueblesdemicasa@outlook.es">mueblesdemicasa@outlook.es</a></p>
  </header>

  <main>
    <section class="gallery-section" aria-label="Catálogo de muebles">
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Imagen ampliada" hidden>
    <button class="lightbox-close" type="button" aria-label="Cerrar imagen">&times;</button>
    <button class="lightbox-arrow lightbox-prev" type="button" aria-label="Imagen anterior">&#8592;</button>
    <figure class="lightbox-figure">
      <img id="lightbox-image" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-arrow lightbox-next" type="button" aria-label="Imagen siguiente">&#8594;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
